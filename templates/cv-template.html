<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{FULL_NAME}} — CV</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 11pt; line-height: 1.35; color: #1a1a1a; }
  h1 { font-size: 20pt; margin: 0 0 2pt 0; }
  .contact { font-size: 10pt; color: #333; margin-bottom: 12pt; }
  h2 { font-size: 12.5pt; text-transform: uppercase; letter-spacing: 0.5pt; border-bottom: 1pt solid #333; margin: 14pt 0 6pt 0; padding-bottom: 2pt; }
  h3 { font-size: 11.5pt; margin: 10pt 0 0 0; break-after: avoid-page; page-break-after: avoid; }
  .role-meta { font-size: 10pt; color: #444; margin-bottom: 3pt; break-after: avoid-page; page-break-after: avoid; break-before: avoid-page; page-break-before: avoid; }
  ul { margin: 4pt 0 8pt 0; padding-left: 16pt; }
  li { margin-bottom: 3pt; }
  .tech { font-size: 10pt; color: #444; margin-bottom: 6pt; }
  .skills-group { margin-bottom: 5pt; }
  .skills-group b { font-size: 10.5pt; }
  .fixed-role { break-inside: avoid; page-break-inside: avoid; }
</style>
</head>
<body>

<!--
  CV TEMPLATE — master skeleton, not a live include.

  Usage: copy this file to applications/<id>/cv.html, then replace
  every {{PLACEHOLDER}} below with tailored content for that
  application. Once copied, the application's cv.html is
  self-contained — later edits to THIS template file do not change
  any already-generated CV. That's intentional: a submitted
  application's CV must never silently change after the fact.

  {{FULL_NAME}}, {{EDUCATION}}, and {{LANGUAGES}} come from
  profile/experience.md's Contact/Education/Languages sections — fixed
  facts, copy them verbatim into the placeholders below rather than
  paraphrasing.

  {{CONTACT_LINE}}: omit the whole <div class="contact">...</div> line
  entirely for Upwork applications (see
  reference/recruiter-playbook.md's Upwork contact-info rule) — don't
  leave it empty, remove the element.

  Page breaks: wrap each SHORT, fixed older role (the three earliest
  roles in profile/experience.md — 2-3 bullets each) in
  <div class="fixed-role">...</div> so a page break never lands between
  its last bullet and its Tech: line (a real orphaning bug, fixed
  2026-09-24). Do NOT wrap the two longer tailored roles the same way —
  a long block is fine splitting across a page, forcing it to stay
  together can push it awkwardly instead.
-->

<h1>{{FULL_NAME}}</h1>
<div class="contact">{{CONTACT_LINE}}</div>

<h2>Professional Summary</h2>
<p>{{PROFESSIONAL_SUMMARY}}</p>

<h2>Skills</h2>
{{SKILLS_GROUPS}}

<h2>Experience</h2>
{{EXPERIENCE_BLOCKS}}

<h2>Education</h2>
<p>{{EDUCATION}}</p>

<h2>Languages</h2>
<p>{{LANGUAGES}}</p>

</body>
</html>
